[package]
name = "daapstt"
version = "0.1.0"
edition = "2021"
description = "Voice input daemon — global push-to-talk dictation via ElevenLabs Scribe v2"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for ElevenLabs API
reqwest = { version = "0.12", features = ["multipart", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"

# ElevenLabs realtime WebSocket transport
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Keyboard input via evdev
evdev = "0.12"

# XDG paths
dirs = "5"

# Unicode-safe realtime tail editing
unicode-segmentation = "1.12"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Signal handling
tokio-util = { version = "0.7", features = ["io"] }
libc = "0.2.186"

# Raw terminal input for interactive keyterm management.
crossterm = "0.28"
